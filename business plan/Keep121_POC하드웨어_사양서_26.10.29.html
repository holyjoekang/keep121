<style>

<script id="data" type="application/json">{"meta": {"title": "POC 하드웨어 구매 사양서", "sub": "Keep Tag(GPS·LTE 명찰) · Keep Check(NFC 명찰) · BLE 전용 태그 · 예산 50만 원 내외", "org": "Keep121 · 강신조", "version": "2026.10.29"}, "pages": [{"no": "01", "title": "목적과 구매 구성", "blocks": [{"t": "p", "v": "이번 POC는 사업계획서 v1.1의 <b>W2 Plan A/B 관문<\/b>을 실물로 판정하기 위한 소량 구매입니다. Plan A는 “<b>KC 인증 + 국내 등록 위치정보사업자 플랫폼 + API + 명찰형 + 해외 로밍<\/b>”을 모두 갖춘 기성 GPS·LTE 명찰(Keep Tag), Plan B는 통신사 트래커 + 무단말 NFC 명찰(Keep Check)입니다. 여기에 <b>BLE 전용 태그<\/b>를 함께 실증해, 사업계획 v1.1의 “BLE 전용 효과 없음” 판단을 실측으로 확인하거나 뒤집습니다. 금형·자체 PCB·양산 개발은 하지 않습니다."}, {"t": "kv", "v": [["판정할 질문", "① 조건을 다 갖춘 국내 KC 단말이 실재하는가 ② 모의 이탈 시 10분 안에 위치를 받는가 ③ 22명 NFC 점호가 30초 안에 끝나는가 ④ BLE 태그가 버스 승차·미승차를 자동 후보로 가려 NFC 점호를 줄이는가"], ["구매 원칙", "모델당 1대(무상 샘플·대여를 먼저 요청) · 파일럿 투입은 KC 인증 모델만 · 해외 비인증 샘플은 기술 비교 전용"], ["가이드 단말", "보유 Android 휴대폰 사용(NFC·BLE 5·Android 12 이상) — 구매 없음"], ["일정", "10/30 RFQ 메일 → 11/6 회신 마감 → 11/10 발주·수령 → 11/10~21 시험 → 11/24 Plan A/B 판정"]]}, {"t": "table", "cap": "표 1. 구매 구성과 예산 (부가세·배송 포함 추정, 견적으로 확정)", "head": ["#", "품목", "후보", "수량", "예산(원)", "근거"], "rows": [["1", "국내 KC LTE 대인용 트래커", "바른시큐리티 ROADMAX 베이직 GPS-10 (또는 통신사 대여품)", "1", "180,000", "공식몰 표시가 180,000원"], ["2", "해외 Cat-1 명찰형 트래커", "Lansitec Cat-1 Badge Tracker", "1", "120,000", "가격 비공개 · 추정"], ["3", "해외 Cat-1 펜던트형 트래커", "Reachfar RF-V51", "1", "70,000", "가격 비공개 · 추정"], ["4", "시험용 데이터 USIM", "알뜰폰 데이터 전용 2회선 × 2개월", "2", "30,000", "추정"], ["5", "Keep Check 키트", "NTAG215 PVC 카드 50장 + 명찰 케이스·목줄 25세트", "1식", "40,000", "카드 $0.15~0.20/장 + 케이스"], ["6", "BLE 전용 태그", "Minew B7 · KKM W1 · MOKO W6R/W6BR 각 2대 + 액세서리·배송", "6", "90,000", "B7 공식가 US$12, 나머지 추정"], ["7", "예비비", "관세·부가세·추가 배송·재시험", "-", "20,000", "-"], ["", "<b>합계<\/b>", "", "", "<b>550,000<\/b>", "창업활동자금 ‘단말 대여·구매’ 항목 (50만 원 + 10%)"]]}, {"t": "note", "v": "통신사·국내 제조사에서 <b>무상 샘플 또는 1개월 대여<\/b>를 받으면 1번 예산은 같은 모델 2대째(편차 확인)나 통신사 트래커 1대로 돌립니다. 50만 원 안으로 맞춰야 하면 ReachFar(7만 원)를 빼고 Lansitec 1종만 해외 기준선으로 둡니다."}]}, {"no": "02", "title": "Ke
